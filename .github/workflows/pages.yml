name: Deploy menu sites to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "menu*/**"
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage each menuN site under its own /menuN/ path
        run: |
          mkdir -p _site
          for dir in menu*/; do
            name="${dir%/}"
            mkdir -p "_site/$name"
            cp -r "$dir." "_site/$name/"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
